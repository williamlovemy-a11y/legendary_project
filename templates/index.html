<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title MedMind - Оценка симптомов</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>🏥 MedMind</h1>
                <p>Быстрая оценка симптомов</p>
                <p class="disclaimer">⚠️ Информационный сервис. При ухудшении обратитесь к врачу.</p>
            </div>
        </header>

        <!-- Main Chat Area -->
        <div class="chat-container">
            <!-- Quick Buttons -->
            <div class="quick-buttons">
                <h3>Быстрый выбор:</h3>
                <div class="button-group">
                    <button class="quick-btn" data-symptom="Болит голова">🧠 Голова</button>
                    <button class="quick-btn" data-symptom="Болит живот">🫘 Живот</button>
                    <button class="quick-btn" data-symptom="Кашель">🫁 Кашель</button>
                    <button class="quick-btn" data-symptom="Температура">🌡️ Температура</button>
                    <button class="quick-btn" data-symptom="Боль в спине">🔙 Спина</button>
                    <button class="quick-btn" data-symptom="Горло болит">🗣️ Горло</button>
                </div>
            </div>

            <!-- Chat Box -->
            <div id="chat-box" class="chat-box">
                <div class="message system">
                    👋 Привет! Я помогу оценить ваши симптомы. Опишите, что вас беспокоит.
                </div>
            </div>

            <!-- Results Panel (hidden by default) -->
            <div id="results-panel" class="results-panel" style="display: none;">
                <div id="triage-indicator" class="triage-indicator"></div>
                <div id="recommendations" class="recommendations"></div>
                <button id="reset-btn" class="btn-secondary">Новая консультация</button>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <textarea id="user-input" placeholder="Опишите симптомы... (Например: сильно болит голова, температура 38)" rows="2"></textarea>
                <div class="input-buttons">
                    <button id="send-btn" class="btn-primary">Отправить</button>
                    <button id="emergency-btn" class="btn-danger">🚨 Экстренно</button>
                </div>
            </div>

            <!-- History -->
            <div class="history-section">
                <h3>История консультаций</h3>
                <div id="history-list" class="history-list"></div>
            </div>
        </div>

        <!-- Footer -->
        <footer class="footer">
            <p>⚠️ Данный сервис предоставляет информационные советы и не заменяет консультацию врача.</p>
            <p>При возникновении экстренной ситуации вызовите скорую помощь: <strong>112</strong></p>
        </footer>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
